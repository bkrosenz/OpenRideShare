[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openrideshare"
version = "0.1.0"
description = "Invitation-only community ride sharing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "bcrypt>=4.2,<6",
  "PyJWT>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "requests>=2.32,<3"]
android = ["kivy>=2.3,<3", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]